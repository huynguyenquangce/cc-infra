name: Networking Terraform
run-name: Networking ${{ inputs.operation }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, apply, preview destruction, or destroy shared networking
        type: choice
        options: [plan, apply, plan-destroy, destroy]
        default: plan
        required: true
      destroy_confirmation:
        description: 'For destroy only, type exactly: destroy-networking'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: cc-terraform-networking
  cancel-in-progress: false
jobs:
  networking:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: networking
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: live/networking
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
    steps:
      - name: Validate operation and destroy confirmation
        working-directory: ${{ runner.temp }}
        env:
          OPERATION: ${{ inputs.operation }}
          DESTROY_CONFIRMATION: ${{ inputs.destroy_confirmation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            plan|apply|plan-destroy|destroy) ;;
            *) echo "Unsupported operation" >&2; exit 1 ;;
          esac
          if [[ "$OPERATION" == "destroy" && "$DESTROY_CONFIRMATION" != "destroy-networking" ]]; then
            echo "Destroy requires confirmation: destroy-networking" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Check required configuration
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TFVARS_HCL: ${{ secrets.NETWORKING_TFVARS }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID}"
          : "${STATE_BUCKET:?Set STATE_BUCKET}"
          : "${ROLE_ARN:?Set AWS_ROLE_ARN}"
          : "${TFVARS_HCL:?Set NETWORKING_TFVARS}"
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "AWS_ACCOUNT_ID must contain 12 digits" >&2; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo "Invalid AWS_REGION" >&2; exit 1; }
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "STATE_BUCKET must be a bucket name, without s3:// or a path" >&2; exit 1; }
          [[ "$ROLE_ARN" == "arn:aws:iam::$AWS_ACCOUNT_ID:role/cc-terraform-networking" ]] || { echo "AWS_ROLE_ARN does not match this account/environment" >&2; exit 1; }
          umask 077
          printf '%s\n' "$TFVARS_HCL" > terraform.tfvars
      - name: Assume networking role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: cc-networking-${{ github.run_id }}
          unset-current-credentials: true
      - name: Initialize S3 backend
        run: |
          set -euo pipefail
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=networking/terraform.tfstate" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform validate -no-color
      - name: Create networking plan for the selected operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          plan_options=()
          case "$OPERATION" in
            plan|apply) ;;
            plan-destroy|destroy) plan_options+=(-destroy) ;;
            *) echo "Unsupported operation" >&2; exit 1 ;;
          esac
          terraform plan "${plan_options[@]}" -input=false -lock-timeout=5m -no-color \
            -var="aws_account_id=$AWS_ACCOUNT_ID" \
            -var="aws_region=$AWS_REGION" -out=networking.tfplan
      - name: Execute the saved plan from this run
        if: inputs.operation == 'apply' || inputs.operation == 'destroy'
        run: terraform apply -input=false -lock-timeout=5m -no-color networking.tfplan
      - name: Remove local plan and variables
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f live/networking/networking.tfplan live/networking/terraform.tfvars
