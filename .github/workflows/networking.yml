name: Networking Terraform
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect a plan or create a fresh plan and apply it
        type: choice
        options: [plan, apply]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: cc-terraform-networking
  cancel-in-progress: false
jobs:
  networking:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: networking
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: live/networking
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Check required configuration
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TFVARS_HCL: ${{ secrets.NETWORKING_TFVARS }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID}"
          : "${STATE_BUCKET:?Set STATE_BUCKET}"
          : "${ROLE_ARN:?Set AWS_ROLE_ARN}"
          : "${TFVARS_HCL:?Set NETWORKING_TFVARS}"
          umask 077
          printf '%s\n' "$TFVARS_HCL" > terraform.tfvars
      - name: Assume networking role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: cc-networking-${{ github.run_id }}
          unset-current-credentials: true
      - name: Initialize S3 backend
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=networking/terraform.tfstate" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform validate -no-color
      - name: Plan networking
        run: |
          terraform plan -input=false -lock-timeout=5m -no-color \
            -var="aws_account_id=$AWS_ACCOUNT_ID" \
            -var="aws_region=$AWS_REGION" -out=networking.tfplan
      - name: Apply the plan from this run
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -lock-timeout=5m -no-color networking.tfplan
      - name: Remove local plan and variables
        if: always()
        run: rm -f networking.tfplan terraform.tfvars
