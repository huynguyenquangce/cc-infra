name: Terraform validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [bootstrap, live/networking, live/uat, live/production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize without AWS backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration and provider schema
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color

  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Install YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Verify workflow environment isolation and destroy guards
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  module-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [modules/api-proxy, modules/mcp-server, modules/cloudfront-vpc-origin, modules/network, live/uat, live/production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Initialize API Proxy module without AWS backend
        run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false -lockfile=readonly
      - name: Test ALB routing contract using mock AWS provider
        run: terraform -chdir=${{ matrix.root }} test -no-color
